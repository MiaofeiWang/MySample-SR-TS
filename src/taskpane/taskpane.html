<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contoso Task Pane Add-in</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/beta/hosted/office.debug.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/11.0.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
    <header class="ms-welcome__header ms-bgColor-neutralLighter">
        <img width="50" height="50" src="../../assets/logo-filled.png" alt="Contoso" title="Contoso" />
        <h1 class="ms-font-xxl">Welcome</h1>
    </header>
    <section id="sideload-msg" class="ms-welcome__main">
        <h2 class="ms-font-xl">Please <a target="_blank" href="https://learn.microsoft.com/office/dev/add-ins/testing/test-debug-office-add-ins#sideload-an-office-add-in-for-testing">sideload</a> your add-in to see app body.</h2>
    </section>
    <main id="app-body" class="ms-welcome__main" style="display: none;">
        <!-- Function Management Card -->
        <section class="card">
            <h3 class="ms-font-l card-title">Function Management</h3>
            
            <div class="form-group">
                <label class="ms-font-m">Show Functions</label>
                <div class="input-with-button">
                    <input type="text" id="showFunctionsInput" class="ms-TextField-field" placeholder="Name1, Name2..." />
                    <button id="showFunctionsBtn" class="ms-Button ms-Button--primary">
                        <span class="ms-Button-label">Apply</span>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label class="ms-font-m">Hide Functions</label>
                <div class="input-with-button">
                    <input type="text" id="hideFunctionsInput" class="ms-TextField-field" placeholder="Name1, Name2..." />
                    <button id="hideFunctionsBtn" class="ms-Button ms-Button--primary">
                        <span class="ms-Button-label">Apply</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- Load Behavior Card -->
        <section class="card">
            <h3 class="ms-font-l card-title">Load Behavior</h3>
            
            <div class="status-row">
                <span class="ms-font-m">Current: <strong id="currentLoadBehavior">Unknown</strong></span>
                <button id="getLoadBehaviorBtn" class="ms-Button ms-Button--standard icon-button" title="Refresh">
                    <i class="ms-Icon ms-Icon--Refresh"></i>
                </button>
            </div>

            <div class="action-row">
                <button id="setLoadBehaviorNoneBtn" class="ms-Button ms-Button--primary full-width">
                    <span class="ms-Button-label">Set to None</span>
                </button>
                <button id="setLoadBehaviorLoadBtn" class="ms-Button ms-Button--primary full-width">
                    <span class="ms-Button-label">Set to Load</span>
                </button>
            </div>
        </section>
    </main>
</body>

</html>
